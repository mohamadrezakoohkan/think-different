<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 168" width="520" height="168" role="img" aria-labelledby="title">
  <title id="title">think different — a toolkit for the crazy ones</title>
  <defs>
    <mask id="cut">
      <rect width="520" height="168" fill="#fff"/>
      <circle cx="104" cy="62" r="45" fill="#000"/>
    </mask>
  </defs>
  <!-- the square hole -->
  <rect x="20" y="44" width="96" height="96" rx="6" fill="none" stroke="#111111" stroke-width="10" mask="url(#cut)"/>
  <!-- the round peg, breaking out -->
  <circle cx="104" cy="62" r="36" fill="#FF4F2E"/>
  <text x="160" y="98" font-family="'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="56" letter-spacing="-1.5" textLength="338" lengthAdjust="spacingAndGlyphs" fill="#111111"><tspan font-weight="400">think</tspan> <tspan font-weight="800" fill="#FF4F2E">different</tspan></text>
  <text x="163" y="132" font-family="'SF Pro Text', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" letter-spacing="3" textLength="335" lengthAdjust="spacing" fill="#6B7280">A TOOLKIT FOR THE CRAZY ONES</text>
</svg>
